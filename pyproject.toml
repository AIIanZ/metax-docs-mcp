[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metax-docs-mcp"
version = "0.2.0"
description = "Local MCP server for MACA programming docs and MetaX vLLM/SGLang source code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "httpx",
    "beautifulsoup4",
    "markdownify",
]

[project.scripts]
metax-docs-mcp = "metax_docs_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
